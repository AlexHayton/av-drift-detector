<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1170" width="1280" height="1170" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="1280" height="1170" fill="#16181d"/>
<image href="data:image/png;base64," x="0" y="0" width="1280" height="720"/>
<rect x="31" y="22" width="1218" height="176" fill="none" stroke="#ff9f1c" stroke-width="5" rx="6"/>
<circle cx="35" cy="26" r="20" fill="#ff9f1c"/>
<text x="35" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="#16181d">1</text>
<rect x="31" y="216" width="421" height="89" fill="none" stroke="#2ec4f6" stroke-width="5" rx="6"/>
<circle cx="35" cy="220" r="20" fill="#2ec4f6"/>
<text x="35" y="228" text-anchor="middle" font-size="24" font-weight="700" fill="#16181d">2</text>
<rect x="31" y="315" width="328" height="66" fill="none" stroke="#7bd389" stroke-width="5" rx="6"/>
<circle cx="35" cy="319" r="20" fill="#7bd389"/>
<text x="35" y="327" text-anchor="middle" font-size="24" font-weight="700" fill="#16181d">3</text>
<rect x="31" y="391" width="717" height="40" fill="none" stroke="#f15bb5" stroke-width="5" rx="6"/>
<circle cx="35" cy="395" r="20" fill="#f15bb5"/>
<text x="35" y="403" text-anchor="middle" font-size="24" font-weight="700" fill="#16181d">4</text>
<rect x="31" y="435" width="248" height="28" fill="none" stroke="#c77dff" stroke-width="5" rx="6"/>
<circle cx="301" cy="449.0" r="20" fill="#c77dff"/>
<text x="301" y="457.0" text-anchor="middle" font-size="24" font-weight="700" fill="#16181d">5</text>
<rect x="31" y="476" width="718" height="215" fill="none" stroke="#00f5d4" stroke-width="5" rx="6"/>
<circle cx="35" cy="480" r="20" fill="#00f5d4"/>
<text x="35" y="488" text-anchor="middle" font-size="24" font-weight="700" fill="#16181d">6</text>
<rect x="773" y="216" width="474" height="474" fill="none" stroke="#fee440" stroke-width="5" rx="6"/>
<circle cx="777" cy="220" r="20" fill="#fee440"/>
<text x="777" y="228" text-anchor="middle" font-size="24" font-weight="700" fill="#16181d">7</text>
<rect x="32" y="689" width="404" height="22" fill="none" stroke="#ff7a85" stroke-width="5" rx="6"/>
<circle cx="460" cy="700.0" r="20" fill="#ff7a85"/>
<text x="460" y="708.0" text-anchor="middle" font-size="24" font-weight="700" fill="#16181d">8</text>
<circle cx="44" cy="764" r="16" fill="#ff9f1c"/>
<text x="44" y="772" text-anchor="middle" font-size="20" font-weight="700" fill="#16181d">1</text>
<text x="76" y="772" font-size="23" fill="#f2f2f2"><tspan font-weight="700">Barcode strip</tspan><tspan fill="#c9ccd3">  48 bits: version, rate code, Gray-coded frame number, CRC-8. Big cells, for copies and cameras.</tspan></text>
<circle cx="44" cy="814" r="16" fill="#2ec4f6"/>
<text x="44" y="822" text-anchor="middle" font-size="20" font-weight="700" fill="#16181d">2</text>
<text x="76" y="822" font-size="23" fill="#f2f2f2"><tspan font-weight="700">SMPTE timecode</tspan><tspan fill="#c9ccd3">  For people stepping through frames; drop-frame at 29.97 and 59.94.</tspan></text>
<circle cx="44" cy="864" r="16" fill="#7bd389"/>
<text x="44" y="872" text-anchor="middle" font-size="20" font-weight="700" fill="#16181d">3</text>
<text x="76" y="872" font-size="23" fill="#f2f2f2"><tspan font-weight="700">Frame number</tspan><tspan fill="#c9ccd3">  The same number the barcode, QR code and audio carry.</tspan></text>
<circle cx="44" cy="914" r="16" fill="#f15bb5"/>
<text x="44" y="922" text-anchor="middle" font-size="20" font-weight="700" fill="#16181d">4</text>
<text x="76" y="922" font-size="23" fill="#f2f2f2"><tspan font-weight="700">Frame-in-second ticks</tspan><tspan fill="#c9ccd3">  One slot per frame; the lit slot steps every frame.</tspan></text>
<circle cx="44" cy="964" r="16" fill="#c77dff"/>
<text x="44" y="972" text-anchor="middle" font-size="20" font-weight="700" fill="#16181d">5</text>
<text x="76" y="972" font-size="23" fill="#f2f2f2"><tspan font-weight="700">Info line</tspan><tspan fill="#c9ccd3">  Frame size, frame rate and the file's length.</tspan></text>
<circle cx="44" cy="1014" r="16" fill="#00f5d4"/>
<text x="44" y="1022" text-anchor="middle" font-size="20" font-weight="700" fill="#16181d">6</text>
<text x="76" y="1022" font-size="23" fill="#f2f2f2"><tspan font-weight="700">The dancer</tspan><tspan fill="#c9ccd3">  An 8-second routine in time with the ticks; smooth motion shows up judder.</tspan></text>
<circle cx="44" cy="1064" r="16" fill="#fee440"/>
<text x="44" y="1072" text-anchor="middle" font-size="20" font-weight="700" fill="#16181d">7</text>
<text x="76" y="1072" font-size="23" fill="#f2f2f2"><tspan font-weight="700">QR code</tspan><tspan fill="#c9ccd3">  Frame, rate, audio plan, frame size. Found anywhere in a camera image; links here.</tspan></text>
<circle cx="44" cy="1114" r="16" fill="#ff7a85"/>
<text x="44" y="1122" text-anchor="middle" font-size="20" font-weight="700" fill="#16181d">8</text>
<text x="76" y="1122" font-size="23" fill="#f2f2f2"><tspan font-weight="700">Project link</tspan><tspan fill="#c9ccd3">  Where to find this project, small, under the stage.</tspan></text>
</svg>
