[package]
name = "av-drift-detector"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
description = "Generate machine-readable A/V sync test videos and measure audio/video drift frame by frame"
license.workspace = true
readme = "../../README.md"
repository.workspace = true
documentation = "https://docs.rs/av-drift-detector"
keywords = ["ffmpeg", "av-sync", "lipsync", "video", "audio"]
categories = ["multimedia::video", "multimedia::audio", "command-line-utilities"]

[features]
default = ["cli", "ffmpeg", "qr-decode"]
cli = ["ffmpeg", "dep:clap", "dep:anyhow", "dep:serde_json", "dep:indicatif"]
# Reading and writing media files: `analyze`, `generate` and `media::{decode, encode}`.
ffmpeg = ["dep:ffmpeg-next"]
# The same through the `ffmpeg` and `ffprobe` programs, with nothing linked:
# `media::ffmpeg_cli`. Used by the Node.js and Python packages.
ffmpeg-cli = ["dep:serde_json"]
qr-decode = ["dep:rqrr"]

[dependencies]
ffmpeg-next = { version = "9.0", optional = true }
qrcode = { version = "0.14", default-features = false }
rustfft = "6.4"
rqrr = { version = "0.11", optional = true }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
anyhow = { version = "1.0", optional = true }
clap = { version = "4.6", features = ["derive"], optional = true }
indicatif = { version = "0.18", optional = true }
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
serde_json = "1.0"
tempfile = "3.27"

[[bin]]
name = "av-drift"
path = "src/main.rs"
required-features = ["cli"]
