name: Release

# Runs when scripts/version.py pushes a version tag (see docs/development.md#releasing).
on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CRATE: av-drift-detector

jobs:
  prepare:
    name: Check the tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag matches every manifest and has release notes
        id: version
        run: |
          python3 scripts/version.py check --tag "$GITHUB_REF_NAME"
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/version.py notes "$version" > /dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME isn't on main; release from main with scripts/version.py"
            exit 1
          fi

  ci:
    name: CI
    needs: prepare
    uses: ./.github/workflows/ci.yml

  crates-io:
    name: Publish to crates.io
    needs: [prepare, ci]
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      id-token: write # trusted publishing
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Skip versions already on crates.io
        id: existing
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "$CRATE release workflow (https://github.com/$GITHUB_REPOSITORY)" \
            "https://crates.io/api/v1/crates/$CRATE/$VERSION")
          case "$status" in
            200) echo "published=true" >> "$GITHUB_OUTPUT"
                 echo "::notice::$CRATE $VERSION is already on crates.io; not publishing it again" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *)   echo "::error::crates.io answered HTTP $status"; exit 1 ;;
          esac
      - if: steps.existing.outputs.published == 'false'
        uses: actions/checkout@v7
      - if: steps.existing.outputs.published == 'false'
        uses: ./.github/actions/setup-ffmpeg
      - if: steps.existing.outputs.published == 'false'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.existing.outputs.published == 'false'
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - if: steps.existing.outputs.published == 'false'
        run: cargo publish --locked -p "$CRATE"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  packages:
    name: Packages
    needs: prepare
    uses: ./.github/workflows/packages.yml

  npm:
    name: Publish to npm
    needs: [prepare, ci, packages]
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write # provenance
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PACKAGE: av-drift-detector
    steps:
      - name: Skip versions already on npm
        id: existing
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/$PACKAGE/$VERSION")
          case "$status" in
            200) echo "published=true" >> "$GITHUB_OUTPUT"
                 echo "::notice::$PACKAGE $VERSION is already on npm; not publishing it again" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *)   echo "::error::npm answered HTTP $status"; exit 1 ;;
          esac
      - if: steps.existing.outputs.published == 'false'
        uses: actions/checkout@v7
      - if: steps.existing.outputs.published == 'false'
        uses: pnpm/action-setup@v6
      - if: steps.existing.outputs.published == 'false'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - if: steps.existing.outputs.published == 'false'
        run: pnpm install --frozen-lockfile
      - if: steps.existing.outputs.published == 'false'
        uses: actions/download-artifact@v8
        with:
          pattern: npm-*
          path: bindings/node/artifacts
      # `npm publish` runs prepublishOnly (`napi pre-publish`), which checks every
      # platform has its binary, publishes the platform packages and lists them
      # as optional dependencies; then the main package is published.
      - if: steps.existing.outputs.published == 'false'
        name: Publish
        working-directory: bindings/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          pnpm exec napi artifacts -d artifacts
          tag=latest
          if [ "$PRERELEASE" = true ]; then tag=next; fi
          npm publish --access public --tag "$tag"

  pypi:
    name: Publish to PyPI
    needs: [prepare, ci, packages]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write # trusted publishing
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PACKAGE: av-drift-detector
    steps:
      - name: Skip versions already on PyPI
        id: existing
        run: |
          pep440=$(echo "$VERSION" | sed -E 's/-alpha\./a/; s/-beta\./b/; s/-rc\./rc/')
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/$PACKAGE/$pep440/json")
          case "$status" in
            200) echo "published=true" >> "$GITHUB_OUTPUT"
                 echo "::notice::$PACKAGE $pep440 is already on PyPI; not publishing it again" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *)   echo "::error::PyPI answered HTTP $status"; exit 1 ;;
          esac
      - if: steps.existing.outputs.published == 'false'
        uses: actions/download-artifact@v8
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - if: steps.existing.outputs.published == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1

  github:
    name: GitHub release
    needs: [prepare, crates-io, npm, pypi]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          {
            python3 scripts/version.py notes "$VERSION"
            echo
            echo "## Install"
            echo
            pep440=$(echo "$VERSION" | sed -E 's/-alpha\./a/; s/-beta\./b/; s/-rc\./rc/')
            echo '```sh'
            echo "cargo install $CRATE --version $VERSION       # the av-drift command"
            echo "npm install $CRATE@$VERSION                    # Node.js"
            echo "pip install $CRATE==$pep440                    # Python"
            echo '```'
            echo
            echo "The command links FFmpeg's libraries; the Node.js and Python packages run the \`ffmpeg\` and \`ffprobe\` programs (FFmpeg 5.1 or later). See [Getting started](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/getting-started.md#install)."
            echo "Packages: [crates.io](https://crates.io/crates/$CRATE/$VERSION) · [npm](https://www.npmjs.com/package/$CRATE/v/$VERSION) · [PyPI](https://pypi.org/project/$CRATE/$pep440/) · [API docs](https://docs.rs/$CRATE/$VERSION)"
          } > notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md
          elif [ "$PRERELEASE" = true ]; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md --prerelease
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md --latest
          fi
