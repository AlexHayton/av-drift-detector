name: Release

# Runs when scripts/version.py pushes a version tag (see docs/development.md#releasing).
on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CRATE: av-drift-detector

jobs:
  prepare:
    name: Check the tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag matches every manifest and has release notes
        id: version
        run: |
          python3 scripts/version.py check --tag "$GITHUB_REF_NAME"
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/version.py notes "$version" > /dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME isn't on main; release from main with scripts/version.py"
            exit 1
          fi

  ci:
    name: CI
    needs: prepare
    uses: ./.github/workflows/ci.yml

  crates-io:
    name: Publish to crates.io
    needs: [prepare, ci]
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      id-token: write # trusted publishing
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Skip versions already on crates.io
        id: existing
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "$CRATE release workflow (https://github.com/$GITHUB_REPOSITORY)" \
            "https://crates.io/api/v1/crates/$CRATE/$VERSION")
          case "$status" in
            200) echo "published=true" >> "$GITHUB_OUTPUT"
                 echo "::notice::$CRATE $VERSION is already on crates.io; not publishing it again" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *)   echo "::error::crates.io answered HTTP $status"; exit 1 ;;
          esac
      - if: steps.existing.outputs.published == 'false'
        uses: actions/checkout@v7
      - if: steps.existing.outputs.published == 'false'
        uses: ./.github/actions/setup-ffmpeg
      - if: steps.existing.outputs.published == 'false'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.existing.outputs.published == 'false'
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - if: steps.existing.outputs.published == 'false'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github:
    name: GitHub release
    needs: [prepare, crates-io]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          {
            python3 scripts/version.py notes "$VERSION"
            echo
            echo "## Install"
            echo
            echo '```sh'
            echo "cargo install $CRATE --version $VERSION"
            echo '```'
            echo
            echo "This needs FFmpeg's libraries; see [Getting started](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/getting-started.md#install)."
            echo "Library: [crates.io](https://crates.io/crates/$CRATE/$VERSION) · [API docs](https://docs.rs/$CRATE/$VERSION)"
          } > notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md
          elif [ "$PRERELEASE" = true ]; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md --prerelease
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md --latest
          fi
