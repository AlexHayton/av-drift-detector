name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # from release.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ffmpeg
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all --check
      - name: Version numbers agree
        run: python3 scripts/version.py check
      - name: Release script tests
        run: python3 -m unittest discover -s scripts
      - name: Clippy (every crate, all features)
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Clippy (library, no default features)
        run: cargo clippy --locked -p av-drift-detector --lib --no-default-features -- -D warnings
      - name: Test the library without FFmpeg
        run: cargo test --locked -p av-drift-detector --lib --no-default-features --features qr-decode
      - name: Docs
        run: cargo doc --locked -p av-drift-detector --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 24.04 packages FFmpeg 6.1; Homebrew tracks the latest release.
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ffmpeg
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The library and the CLI (the bindings have their own jobs).
      - name: Build
        run: cargo build --locked --all-targets
      - name: Test
        run: cargo test --locked
      - name: The ffmpeg-program backend matches the linked one
        run: cargo test --locked -p av-drift-detector --features ffmpeg-cli --lib --test ffmpeg_cli
      - name: CLI smoke test
        run: |
          cargo run --locked --release --bin av-drift -- generate --fps 29.97 --duration 3 --audio-offset 25ms -o smoke.mp4
          cargo run --locked --release --bin av-drift -- analyze smoke.mp4 --max-drift 26ms
          cargo run --locked --release --bin av-drift -- analyze smoke.mp4 --json > report.json
          grep -q '"capture": "file"' report.json

  node:
    name: Node.js package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ffmpeg
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test
      - name: Generated loader and types are committed
        run: git diff --exit-code -- bindings/node/index.js bindings/node/index.d.ts

  python:
    name: Python package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ffmpeg
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # setup-uv publishes only full version tags (there is no floating v10).
      - uses: astral-sh/setup-uv@v10.3.0
      # Builds the extension (maturin) and installs it with pytest.
      - run: uv sync --locked
      - run: uv run pytest bindings/python

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ffmpeg
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets
