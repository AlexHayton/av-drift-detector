name: Set up FFmpeg
description: Installs the FFmpeg programs, and (on Linux and macOS) the development libraries that ffmpeg-next builds against.
runs:
  using: composite
  steps:
    - name: Install FFmpeg (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          ffmpeg pkg-config clang libclang-dev \
          libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev \
          libavdevice-dev libswscale-dev libswresample-dev
    - name: Install FFmpeg (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: brew install ffmpeg pkgconf
    # Only the programs: the Node.js and Python packages run them rather than linking.
    - name: Install FFmpeg (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: choco install ffmpeg --no-progress -y
    - name: Show FFmpeg version
      shell: bash
      run: |
        ffmpeg -hide_banner -version | head -1
        ffprobe -hide_banner -version | head -1
        if [ "$RUNNER_OS" != Windows ]; then
          pkg-config --modversion libavcodec libavformat libavutil
        fi
