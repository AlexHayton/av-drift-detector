[workspace]
resolver = "3"
members = [
    "crates/av-drift-detector",
    # Bindings: not published to crates.io.
    "bindings/node",
    "bindings/python",
]
# A plain `cargo build` or `cargo test` skips the bindings, which need Node or
# Python tooling; `--workspace` includes them.
default-members = ["crates/av-drift-detector"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/AlexHayton/av-drift-detector"

# The DSP and pixel loops are far too slow unoptimised; keep tests usable.
[profile.test]
opt-level = 3

[profile.dev]
opt-level = 1
