[package]
name = "av-drift-detector"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Generate machine-readable A/V sync test videos and measure audio/video drift frame by frame"
license = "MIT"
readme = "README.md"
repository = "https://github.com/AlexHayton/av-drift-detector"
documentation = "https://docs.rs/av-drift-detector"
keywords = ["ffmpeg", "av-sync", "lipsync", "video", "audio"]
categories = ["multimedia::video", "multimedia::audio", "command-line-utilities"]
# Media for the README is served from the repository, not the crate.
exclude = ["/docs/media", "/.github", "/scripts"]

[features]
default = ["cli", "qr-decode"]
cli = ["dep:clap", "dep:anyhow", "dep:serde_json", "dep:indicatif"]
qr-decode = ["dep:rqrr"]

[dependencies]
ffmpeg-next = "9.0"
qrcode = { version = "0.14", default-features = false }
rustfft = "6.4"
rqrr = { version = "0.11", optional = true }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
anyhow = { version = "1.0", optional = true }
clap = { version = "4.6", features = ["derive"], optional = true }
indicatif = { version = "0.18", optional = true }
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
serde_json = "1.0"
tempfile = "3.27"

[[bin]]
name = "av-drift"
path = "src/main.rs"
required-features = ["cli"]

# The DSP and pixel loops are far too slow unoptimised; keep tests usable.
[profile.test]
opt-level = 3

[profile.dev]
opt-level = 1
